name: arxiv_summary

services:
  arxiv-summary:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arxiv-summary:latest
    container_name: arxiv-summary
    user: "${ARXIV_SUMMARY_UID:-1000}:${ARXIV_SUMMARY_GID:-1000}"
    environment:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output
      - ../web:/app/web
    command: ["./docker/run_daily.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arxiv-summary:latest
    container_name: arxiv-summary-api
    user: "${ARXIV_SUMMARY_UID:-1000}:${ARXIV_SUMMARY_GID:-1000}"
    environment:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output
      - ../web:/app/web
    command: ["uvicorn", "daily_arxiv.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: arxiv-summary-caddy
    environment:
      ARXIV_SUMMARY_API_DOMAIN: "${ARXIV_SUMMARY_API_DOMAIN:-arxiv-summary.221.155.32.232.sslip.io}"
    ports:
      - "${ARXIV_SUMMARY_HTTP_PORT:-80}:80"
      - "${ARXIV_SUMMARY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: arxiv-summary-postgres
    environment:
      TZ: Asia/Seoul
      POSTGRES_USER: arxiv_summary
      POSTGRES_PASSWORD: change-this-password
      POSTGRES_DB: arxiv_summary
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
